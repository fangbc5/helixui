[package]
name = "helixui"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "A modern UI component library for Dioxus applications"
license = "MIT"
repository = "https://github.com/fangbaichun/helixui"
homepage = "https://github.com/fangbaichun/helixui"
documentation = "https://docs.rs/helixui"
readme = "README.md"
keywords = ["dioxus", "ui", "components", "rust", "web"]
categories = ["gui", "web-programming", "development-tools"]
rust-version = "1.70"

[lib]
name = "helixui"
path = "src/lib.rs"

[dependencies]
dioxus.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures.workspace = true
time.workspace = true
js-sys.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true, features = ["time"]}
time.workspace = true
js-sys.workspace = true
arboard.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
gloo-timers = { workspace = true, features = ["futures"] }
web-sys.workspace = true
wasm-bindgen-futures.workspace = true

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
